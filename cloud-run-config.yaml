# Cloud Run サービス設定例
# このファイルは参考用です。実際のデプロイ時には gcloud CLI で設定を指定します。

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: red-tetris
  labels:
    cloud.googleapis.com/location: asia-northeast1
spec:
  template:
    metadata:
      annotations:
        # 最小インスタンス数（コスト削減のため0に設定可能）
        autoscaling.knative.dev/minScale: "0"
        # 最大インスタンス数
        autoscaling.knative.dev/maxScale: "10"
        # CPU オールケーション（リクエスト中のみ課金）
        run.googleapis.com/cpu-throttling: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
      - image: gcr.io/PROJECT_ID/red-tetris:latest
        ports:
        - name: http1
          containerPort: 8080
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "8080"
        # メモリ内DBを使用（リーダーボードは永続化されません）
        - name: DB_TYPE
          value: "memory"
        # CORS設定（本番環境では適切なオリジンを指定）
        # - name: CORS_ORIGIN
        #   value: "https://your-domain.com"
        resources:
          limits:
            cpu: "1"
            memory: "512Mi"
          requests:
            cpu: "0.5"
            memory: "256Mi"

